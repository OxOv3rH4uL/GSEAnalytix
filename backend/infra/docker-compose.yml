services:
  #Postgres Container
  postgres:
    image: postgres:17
    container_name: gse-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: gseanalytix
      POSTGRES_PASSWORD: gseanalytix
      POSTGRES_DB: gseanalytix
    
    ports:
      - "5400:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data

  #Redis container for event-generation  
  redis:
    image: redis
    container_name: gseanalytix-event-generation
    restart: unless-stopped

    ports:
      - "6001:6379"
    
    volumes:
      - redis_data:/data
  
  #Redis container for worker to consumer and do some analysis
  redis2:
    image: redis
    container_name: gseanalytix-data-ingestion
    restart: unless-stopped

    ports:
      - "6002:6379"
    
    volumes:
      - redis2_data:/data

volumes:
  postgres_data:
  redis_data:
  redis2_data:

